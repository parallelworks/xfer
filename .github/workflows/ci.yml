name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: vet
        run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS ships openrsync as /usr/bin/rsync, so the interop suite
        # there runs against a second, independent implementation.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install GNU rsync
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: test
        run: go test -race -count=1 -timeout 20m ./...

  # Interoperability with the rsync versions found in the wild, from 3.1.3
  # (protocol 31 without algorithm negotiation) to the newest release. Each
  # runs in a container whose distribution packages that version, except
  # 3.4.x, which no distribution ships any more and is built from the
  # release tarball.
  interop:
    name: interop (rsync ${{ matrix.rsync }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rsync: "3.1.3"
            image: ubuntu:20.04
            install: apt-get update && apt-get install -y rsync
          - rsync: "3.2.7"
            image: debian:bookworm
            install: apt-get update && apt-get install -y rsync
          - rsync: "3.4.4"
            image: debian:bookworm
            install: >-
              apt-get update &&
              apt-get install -y build-essential curl ca-certificates
              libpopt-dev libxxhash-dev libzstd-dev liblz4-dev libssl-dev &&
              curl -fsSL -o /tmp/rsync.tar.gz https://download.samba.org/pub/rsync/src/rsync-3.4.4.tar.gz &&
              echo "bd88cf82fa653da32314fb229136407c5c90f80d1758d8f4b091767877d8fa96  /tmp/rsync.tar.gz" | sha256sum -c - &&
              tar -xzf /tmp/rsync.tar.gz -C /tmp &&
              (cd /tmp/rsync-3.4.4 && ./configure --disable-md2man && make -j"$(nproc)" install)
          - rsync: "3.5.0"
            image: debian:trixie
            install: apt-get update && apt-get install -y rsync
          - rsync: "3.5.1"
            image: alpine:edge
            install: apk add --no-cache rsync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: build static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          go build -o bin/xfer ./cmd/xfer
          go test -c -o bin/rsync.test ./rsync
      - name: run interop suite in ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w/rsync ${{ matrix.image }} sh -c '
            { ${{ matrix.install }} ; } >/dev/null &&
            export XFER_INTEROP_RSYNC="$(command -v rsync)" XFER_INTEROP_XFER=/w/bin/xfer &&
            "$XFER_INTEROP_RSYNC" --version | head -1 &&
            /w/bin/rsync.test -test.run "TestInterop" -test.v -test.timeout 30m'

  interop-openrsync:
    name: interop (macOS openrsync)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: /usr/bin/rsync --version | head -2
      - name: run interop suite
        env:
          XFER_INTEROP_RSYNC: /usr/bin/rsync
        run: go test -count=1 -run TestInterop -v -timeout 30m ./rsync

  # FIPS 140-only mode: Go refuses non-approved algorithms, so this catches
  # any code path that would reach MD4/MD5/SHA-1. Interop scenarios that
  # need MD4/MD5 (protocol < 30, or a peer without xxHash) skip themselves;
  # the rest run against the runner's GNU rsync.
  fips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y rsync
      - name: test in fips140=only mode
        env:
          GODEBUG: fips140=only
        run: go test -count=1 -timeout 20m ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: fuzz every Fuzz target for 30s
        shell: bash
        run: |
          grep -rl --include='*_test.go' '^func Fuzz' . | while read -r file; do
            grep -o '^func Fuzz[A-Za-z0-9_]*' "$file" | cut -d' ' -f2 | while read -r target; do
              echo "== $target ($(dirname "$file"))"
              go test -run '^$' -fuzz "^${target}\$" -fuzztime 30s "$(dirname "$file")"
            done
          done
